const MUTE_KEY = 'braingap.muted';

  function init() {
    if (ctx || failed) return ctx;

      if (!AC) { failed = true; return null; }

      master = ctx.createGain(); master.gain.value = VOLUME;
      master.connect(comp); comp.connect(ctx.destination);
      // einfacher Hall aus abklingendem Rauschen
      const len = Math.floor(ctx.sampleRate * 1.6), buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
      const verb = ctx.createConvolver(); verb.buffer = buf;
      verbIn = ctx.createGain(); const verbOut = ctx.createGain(); verbOut.gain.value = 0.55;

    osc.type = type; osc.detune.value = detune;

    g.gain.setValueAtTime(0.0001, t0);

    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = noiseBuf; f.type = ftype; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  }

    voice(c, { type: 'sine', f0: f, f1: f * 0.4, t0: t, attack: 0.004, decay: 0.32, peak });
    voice(c, { type: 'triangle', f0: f * 2, f1: f * 0.7, t0: t, attack: 0.004, decay: 0.14, peak: peak * 0.35, ftype: 'lowpass', freq: 400 });

    correct: (c, t) => {   // heller Zweiklang, magischer Kristall

    heart_loss: (c, t) => { bass(c, t, 90, 0.85); bass(c, t + 0.19, 72, 0.5); },   // zwei dumpfe Schläge
    victory: (c, t) => {   // Dur-Akkord mit Nachhall

})();

const tierOf = step => step < DIV_TIERS * 4 ? TIERS[Math.floor(step / 4)] : TIERS[DIV_TIERS + step - DIV_TIERS * 4];

// 100 LP pro Division, Überschuss wird mitgenommen. Beim Wechsel in eine neue Liga startet man mit 0 LP.
// Demotion Shield: Die erste Niederlage, die bei 0 LP beginnt, wird abgefangen, die zweite führt zum Abstieg auf 75 LP.
function applyLp({ step, lp, shield = false }, delta) {
  let event = null;
  const before = lp;
  lp += delta;
  if (delta >= 0) {
    while (lp >= 100 && step < MAX_STEP) {
      lp -= 100; step++;
      if (tierOf(step) !== tierOf(step - 1)) { lp = 0; event = 'tier'; } else if (!event) event = 'division';
    }
    if (lp > 0) shield = false;
  } else if (lp < 0) {
    if (step === 0) { lp = 0; shield = false; }                                        // Iron 4 ist der Boden
    else if (before > 0) { lp = 0; }                                                   // erst auf 0 LP gesunken: Shield noch unberührt
    else if (!shield) { lp = 0; shield = true; event = 'shield'; }                     // Shield fängt die erste Niederlage ab
    else { step--; lp = 75; shield = false; event = 'demote'; }                        // zweite Niederlage: Abstieg
  } else if (lp > 0) shield = false;
  return { step, lp, shield, event };
}

// Die Position hängt strikt an den LP: Bots mit mehr LP stehen über dir. Bei Gleichstand stehst du vorn.
// Mit 0 LP bist du Platz 20, mit 99 LP Platz 1.
function buildLeaderboard({ step, lp }, name) {
  const off = step % LB_NAMES.length;                                          // pro Liga andere Namensreihenfolge
  const bots = LB_LP.map((v, i) => ({ name: LB_NAMES[(i + off) % LB_NAMES.length], lp: v }));

  const rows = [...bots];
  rows.splice(pos - 1, 0, { name, lp, me: true });
  return rows.map((r, i) => ({ ...r, pos: i + 1 }));

// Jede Rolle ist wählbar: Gibt es in der eigenen Liga kein Match für die Rolle, gilt das nächstpassende (bevorzugt eine Liga darunter).
const matchPool = (role, step) => {
  const starts = START_IDS.map(id => RUNS.find(r => r.id === id)).filter(sc => sc.role === role && mainLine(sc) !== 'end');
  if (!starts.length) return [];
  const mine = TIERS.indexOf(tierOf(step));
  const dist = sc => { const t = DIFF_TIER[sc.difficulty]; return t <= mine ? mine - t : 100 + (t - mine); };
  const best = Math.min(...starts.map(dist));
  return starts.filter(sc => dist(sc) === best);
};
// Anti-Wiederholung: die zuletzt gespielten Szenario-IDs (Basis-IDs, auch adaptive Varianten) werden bei neuen Läufen zuerst ausgeschlossen
const RECENT_MAX = 15;
const baseId = id => id.split('~')[0];
function freshFirst(ids, recent, n) {
  const fresh = shuffle(ids.filter(i => !recent.includes(baseId(i))));
  if (fresh.length >= n) return fresh.slice(0, n);
  const used = ids.filter(i => recent.includes(baseId(i))).sort((a, b) => recent.indexOf(baseId(b)) - recent.indexOf(baseId(a)));   // am längsten her zuerst
  return [...fresh, ...used].slice(0, n);
}
const chainIds = id => { const out = []; let c = id; while (c !== 'end' && out.length < 10) { const sc = getScenario(c); if (!sc) break; out.push(sc.id); c = mainLine(sc); } return out; };
const freshStarts = (pool, recent) => { const f = pool.filter(sc => !chainIds(sc.id).some(i => recent.includes(baseId(i)))); return f.length ? f : pool; };
const RANKED_ROLES = [['Top', 'Toplane'], ['Mid', 'Midlane'], ['Jungle', 'Jungle'], ['Bot', 'Botlane'], ['Support', 'Support']];

/* ---------- Wertung, Hidden MMR, Momentum ---------- */
// Richtig = beste Option des Szenarios (lpChange > 0). Sieg ab 60 % richtig (3 von 5).
// Die LP-Spanne hängt vom Hidden MMR im Verhältnis zum sichtbaren Rang ab: MMR über dem Rang = mehr Gewinn, weniger Verlust.
function scoreRun(correct, n, mmr, rank) {
  const ratio = correct / n;
  const gap = Math.max(-1, Math.min(1, (mmr - (rank.step * 100 + rank.lp)) / 100));
  const t = (gap + 1) / 2;
  let kind, lp;
  if (ratio >= 1)        { kind = 'Dominanter Sieg';     lp = 24 + Math.round(t * 4); }
  else if (ratio >= 0.6) { kind = 'Knapper Arbeitssieg'; lp = 15 + Math.round(t * 3); }
  else if (ratio >= 0.4) { kind = 'Knappe Niederlage';   lp = -14; }
  else                   { kind = 'Stomp-Niederlage';    lp = -(20 + Math.round((1 - t) * 4)); }
  return { win: ratio >= 0.6, kind, lp, mmrDelta: Math.round(lp * 0.8) };
}
const GOLD_STEP = 700;   // Gold-Unterschied pro Vorsprung in Entscheidungen (Spielgefühl, keine echte Spielmessung)
const GOOD_TAGS = ['Lane-Prio gesichert', 'Vision-Kontrolle gesichert', 'Objective-Tempo auf deiner Seite', 'Wellenvorteil gesichert'];
const BAD_TAGS = ['Gegner mit Lane-Prio', 'Gegner kontrolliert die Vision', 'Gegner übernimmt das Tempo', 'Welle verloren, Team unter Druck'];
function standing(lead, ok, stage) {
  const gold = (Math.abs(lead) * GOLD_STEP).toLocaleString('de-DE');
  const tag = (ok ? GOOD_TAGS : BAD_TAGS)[stage % 4];
  if (lead > 0) return { good: true, text: `Dein Team: +${gold} Gold Vorsprung | ${tag}` };
  if (lead < 0) return { good: false, text: `Gegner: +${gold} Gold Vorsprung | ${tag}` };
  return { good: ok, text: `Ausgeglichen: kein Gold-Unterschied | ${tag}` };
}
function makeMomentum(log, stage) {
  const last = log[log.length - 1];
  const c = log.filter(e => e.ok).length, lead = c - (log.length - c);
  const tag = (last.ok ? GOOD_TAGS : BAD_TAGS)[(stage - 1) % 4];
  return { good: last.ok, text: `${last.ok ? 'Vorteil' : 'Druck'}: ${tag}`, state: standing(lead, last.ok, stage - 1).text };
}

// Welche Karten-Animation passt zur gewählten Aktion? (Schlüsselwörter im Optionstext)
const RECALL_RE = /recall|zur base|resett|backport|items kaufen/i;
const PUSH_RE = /welle|crash|push|freeze|drück/i;
function effectsFor(opt, scenario, ok) {
  const label = opt ? opt.label : '';
  const recall = RECALL_RE.test(label);
  const push = !recall && PUSH_RE.test(label) && !/liegen/i.test(label);
  const text = opt ? `${opt.feedback} ${(opt.chain || []).join(' ')}` : '';
  const caught = /gank|nebel|gestellt|gefangen|gepickt|falle|bestraft|engage|stirbst|angreif/i.test(text);
  return { recall, push, gank: !ok && !!opt && caught && scenario.markers.some(m => m.type === 'fog') };
}

// Kamera-Fokus: kleinster Kartenausschnitt, der alle Marker (auch Fog-of-War) zeigt. Zu weit verteilt = Gesamtansicht.
const LANES = { 'Top-Lane': [[7, 93], [7, 7], [93, 7]], 'Mid-Lane': [[7, 93], [93, 7]], 'Bot-Lane': [[7, 93], [93, 93], [93, 7]] };
const segDist = (p, a, b) => {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy)));
  return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
};
function focusFor(markers) {
  const core = markers.filter(m => m.type !== 'fog');
  if (!core.length) return null;
  const xs = markers.map(m => m.x), ys = markers.map(m => m.y);
  const w = Math.max(...xs) - Math.min(...xs), h = Math.max(...ys) - Math.min(...ys);
  const size = Math.min(100, Math.max(48, Math.max(w, h) + 24));
  if (size > 76) return null;
  const clamp = v => Math.max(0, Math.min(100 - size, v));
  const x0 = clamp((Math.max(...xs) + Math.min(...xs)) / 2 - size / 2), y0 = clamp((Math.max(...ys) + Math.min(...ys)) / 2 - size / 2);
  const inView = m => m.x >= x0 && m.x <= x0 + size && m.y >= y0 && m.y <= y0 + size;
  const objs = core.filter(m => m.type === 'objective' && inView(m)).map(m => m.label).join(' ');
  const c = [core.reduce((t, m) => t + m.x, 0) / core.length, core.reduce((t, m) => t + m.y, 0) / core.length];
  const lane = Object.entries(LANES).map(([n, pts]) => [n, Math.min(...pts.slice(1).map((q, i) => segDist(c, pts[i], q)))]).sort((p, q) => p[1] - q[1])[0][0];
  const zone = /drache|elder/i.test(objs) ? 'Dragon-Pit' : /baron/i.test(objs) ? 'Baron-Pit' : lane;
  return { x0, y0, size, zone };
}

// Taktik-Karte: Mock-Map (Fallback) -> echte Map als Hintergrund -> Marker-Overlay -> Spieler-Porträt, alles in einer zoombaren "Welt".

const MARKER_COLOR = { hero: '#3b82f6', enemy: '#ef4444', objective: '#C89B3C', fog: '#94a3b8' };
const Minimap = ({ markers = [], champion, role, showLabels = false, result = null, fx = null, focus = null, full = false, onToggleView }) => {
  const player = markers.find(m => m.isPlayer);
  const view = focus && !full ? focus : { x0: 0, y0: 0, size: 100 };
  const z = 100 / view.size;
  const sc = Math.pow(1 / z, 0.65);                         // Marker wachsen beim Zoom nur dezent mit
  const k = (showLabels ? 1 : 1.5) * sc;                    // in der Vorschau größere Marker, damit sie ohne Zoom auffallen
  const reduce = typeof window !== 'undefined' && !!window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const at = m => ({ x: 110 + m.x * 1.8, y: 10 + m.y * 1.8 });
  const me = player ? at(player) : null;
  const TOWER = { Toplane: { x: 78, y: 8 }, Midlane: { x: 70, y: 30 }, Jungle: { x: 70, y: 30 }, Botlane: { x: 93, y: 64 }, Support: { x: 93, y: 64 } };
  const towerMarker = markers.find(m => m.type === 'objective' && /turm/i.test(m.label) && !/eigener/i.test(m.label));
  const tower = fx && me ? at(towerMarker || TOWER[role] || { x: 70, y: 30 }) : null;
  const fogSrc = markers.find(m => m.type === 'fog') || markers.find(m => m.type === 'enemy');
  const fxLayer = fx && me ? (
    <g aria-hidden="true">
      {fx.push && tower && (
        <>
          {[0, 1, 2, 3, 4].map(i => {
            const ex = tower.x - 7 + i * 1.6, ey = tower.y + 4 + (i % 2) * 2.5;
            return (
              <circle key={i} cx={reduce ? ex : me.x + i * 2} cy={reduce ? ey : me.y + (i % 2) * 2.5} r={2.3 * sc} fill="#93c5fd" stroke="#1e3a8a" strokeWidth=".6">
                {!reduce && <animate attributeName="cx" from={me.x + i * 2} to={ex} dur="1.9s" begin={`${i * 0.12}s`} fill="freeze" />}
                {!reduce && <animate attributeName="cy" from={me.y + (i % 2) * 2.5} to={ey} dur="1.9s" begin={`${i * 0.12}s`} fill="freeze" />}
              </circle>
            );
          })}
          <circle cx={tower.x} cy={tower.y} r={9 * sc} fill="none" stroke="#fde68a" strokeWidth={2.5 * sc} className="blink" />
        </>
      )}
      {fx.recall && (
        <circle cx={me.x} cy={me.y} r={12 * sc} fill="none" stroke="#60a5fa" strokeWidth={2.5 * sc}>
          {!reduce && <animate attributeName="r" values={`${8 * sc};${18 * sc};${8 * sc}`} dur="1.2s" repeatCount="2" />}
          {!reduce && <animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="2" />}
        </circle>
      )}
      {fx.gank && fogSrc && (() => {
        const g = at(fogSrc);
        return (
          <>
            <line x1={g.x} y1={g.y} x2={me.x} y2={me.y} stroke="#ef4444" strokeWidth={1.5 * sc} strokeDasharray="4 3" opacity=".7" />
            <circle cx={reduce ? me.x : g.x} cy={reduce ? me.y : g.y} r={5 * sc} fill="#ef4444" stroke="#fff" strokeWidth="1">
              {!reduce && <animate attributeName="cx" from={g.x} to={me.x} dur="1.4s" fill="freeze" />}
              {!reduce && <animate attributeName="cy" from={g.y} to={me.y} dur="1.4s" fill="freeze" />}
            </circle>
          </>
        );
      })()}
    </g>
  ) : null;
  return (
    <div className="relative h-full w-full flex items-center justify-center bg-[#010A13]">
      <div className="relative h-full aspect-square overflow-hidden">
        <div className="absolute left-0 top-0 h-full w-full origin-top-left transition-transform duration-700 ease-out motion-reduce:transition-none"

            <path d="M122 178 V22 H278 M122 178 H278 V22" stroke="#45475a" strokeWidth="6" strokeLinejoin="round" strokeLinecap="round" fill="none" />

            <circle cx="122" cy="178" r="11" fill="#3b82f6" fillOpacity=".7" /><circle cx="278" cy="22" r="11" fill="#ef4444" fillOpacity=".7" />

              </div>
              {showLabels && <span className="mt-0.5 text-[10px] font-bold text-[#F5E6B8] [text-shadow:0_0_3px_#010A13]">{player.label}</span>}
            </div>
          )}
        </div>
        {focus && !full && (
          <span className="pointer-events-none absolute left-1.5 top-1.5 rounded bg-black/55 px-1.5 py-0.5 text-[10px] font-semibold text-[#0AC8B9]">Fokus: {focus.zone}</span>
        )}

            className="absolute bottom-1.5 right-1.5 z-20 rounded-md border border-[#C89B3C]/60 bg-[#010A13]/85 px-2 py-1 text-[10px] font-semibold text-[#C89B3C] transition hover:border-[#0AC8B9] hover:text-[#0AC8B9]">
            {full ? 'Fokus-Ansicht' : 'Gesamtansicht'}
          </button>
        )}
      </div>
    </div>
  );
};

    goal: 'Jeden Tag gibt es dasselbe Match für alle Spieler (Rotation nach UTC-Datum). So lassen sich Ergebnisse fair vergleichen.',

function ModeInfo({ mode, onClose }) {
  const m = MODE_INFO[mode];
  const rows = [['target', 'Ziel', m.goal], ['timer', 'Dauer', m.duration], ['heart', 'Risiko & Belohnung', m.risk], ['eye', 'Taktischer Schwerpunkt', m.focus]];
  return (
    <div className="absolute inset-0 z-40 flex items-end justify-center p-3" style={{ background: 'rgba(1,10,19,.85)' }} onClick={onClose}>
      <div role="dialog" aria-modal="true" aria-label={`Info zu ${m.title}`} onClick={e => e.stopPropagation()}
           className="flex max-h-[85%] w-full flex-col gap-3 overflow-y-auto rounded-2xl border border-[#C89B3C]/60 bg-[#06111F] p-4">
        <div className="flex items-center gap-2">
          <Icon n={m.icon} size={22} className="text-[#C89B3C]" />
          <div className="flex-1 font-serif text-lg font-bold">{m.title}</div>
          <button onClick={onClose} aria-label="Schließen" className="p-2 -mr-2 text-slate-300 hover:text-white"><Icon n="x" /></button>
        </div>
        <Divider />
        {rows.map(([ic, h, t]) => (
          <div key={h}>
            <div className="mb-0.5 flex items-center gap-1.5 text-sm font-semibold text-[#C89B3C]"><Icon n={ic} size={14} />{h}</div>
            <div className="text-sm leading-relaxed text-slate-300">{t}</div>
          </div>
        ))}
        <button onClick={onClose} className="mt-1 rounded-xl border border-[#C89B3C]/60 py-2.5 font-serif font-bold transition hover:border-[#0AC8B9]">Verstanden</button>
      </div>
    </div>
  );
}

function Dashboard({ rank, history, hearts, profile, onDaily, onRanked, onPractice, onMastery, onNoHearts, onInfo, onShop, onReset }) {

  return (
    <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
      <div className="rounded-xl border p-3 flex flex-col gap-3" style={{ background: 'var(--panel)', borderColor: 'var(--line)' }}>

            <div className="truncate font-bold">{profile.name}</div>
            <div className="truncate text-sm text-slate-400">Main: {profile.champion} · {profile.role}</div>
            <div className="truncate text-xs text-gray-400">{STATUS[profile.status].emoji} {STATUS[profile.status].label}{profile.note ? ` · „${profile.note}“` : ''}</div>

        <ModeCard wrap="col-span-2" onClick={locked ? onNoHearts : onMastery} locked={locked} onInfo={() => onInfo('mastery')} label="Champion Mastery"

          <ChampAvatar name={profile.champion || 'Heimerdinger'} className="w-10 h-10" />

      <Divider />
      <div className="flex flex-col gap-2">
        <div className="font-serif font-bold">Letzte Runs</div>
        {history.length === 0 && <div className="text-sm text-slate-500 rounded-lg border border-dashed p-3 text-center" style={{ borderColor: 'var(--line)' }}><span aria-hidden="true">🐹</span> Ein Poro schläft hier... Spiel deinen ersten Run.</div>}
        {history.slice(0, 5).map((h, i) => {
          const win = h.lp >= 0, c = win ? 'var(--teal)' : 'var(--red)';
          return (
            <div key={h.ts + '-' + i} className="flex items-center gap-3 rounded-lg border px-3 py-2" style={{ background: 'var(--panel)', borderColor: 'var(--line)' }}>
              <span className="w-8 h-8 shrink-0 rounded-full flex items-center justify-center" style={{ color: c, background: win ? 'rgba(10,200,185,.14)' : 'rgba(232,64,87,.14)' }} aria-label={win ? 'Sieg' : 'Niederlage'}>
                <Icon n={win ? 'check' : 'x'} size={16} />

              <div className="flex-1 min-w-0">
                <div className="font-semibold text-sm truncate">{h.champion}</div>
                <div className="text-xs text-slate-400">{h.role}</div>

  );
}

  <button type="button" onClick={onClick} disabled={disabled} aria-pressed={active}

    {children}
  </button>
);

           className="w-full rounded-2xl border p-4 flex flex-col gap-4" style={{ background: '#06111F', borderColor: 'var(--teal)' }}>
        <div className="flex items-center gap-2">
          <Icon n="target" size={22} className="text-teal-300" />
          <div className="flex-1 font-bold">Übungsmodus</div>
          <button onClick={onClose} aria-label="Schließen" className="p-2 -mr-2 text-slate-300 hover:text-white"><Icon n="x" /></button>

        <div>
          <div className="text-sm font-semibold mb-1.5">Schwierigkeit</div>
          <div className="flex flex-wrap gap-2">{DIFF_FILTERS.map(([l, v]) => <Chip key={l} active={difficulty === v} onClick={() => setDifficulty(v)}>{l}</Chip>)}</div>

const WayCard = ({ active, icon, title, text, onClick }) => (
  <button type="button" onClick={onClick} aria-pressed={active}
    className={`flex flex-col gap-1.5 rounded-xl border p-3 text-left transition active:scale-[.98] ${active
      ? 'border-[#C89B3C] bg-[#0A1428] shadow-[0_0_14px_rgba(200,155,60,.35)]'
      : 'border-[#C89B3C]/40 bg-[#010A13]/80 shadow-[0_2px_0_0_#030712] hover:border-[#0AC8B9]'}`}>
    <Icon n={icon} size={26} className="text-[#C89B3C]" />
    <span className="font-serif font-extrabold text-white leading-tight">{title}</span>
    <span className="text-xs text-gray-400">{text}</span>
  </button>
);

function RankedSetup({ rank, onStart, onClose }) {
  const [way, setWay] = useState(null);       // 'match' | 'quiz'
  const [role, setRole] = useState(null);
  const pool = rankedPool(rank.step);          // Tier-Lock
  const quizCount = Math.min(QUIZ_LENGTH, pool.length);
  const ready = way === 'quiz' || (way === 'match' && !!role);
  const picked = role ? matchPool(role, rank.step)[0] : null;
  return (
    <div className="absolute inset-0 z-40 flex items-end justify-center p-3" style={{ background: 'rgba(1,10,19,.85)' }} onClick={onClose}>
      <div role="dialog" aria-modal="true" aria-label="Ranked Match einrichten" onClick={e => e.stopPropagation()}
           className="w-full rounded-2xl border border-[#C89B3C]/40 bg-[#06111F] p-4 flex flex-col gap-3">
        <div className="flex items-center gap-2">
          <Icon n="swords" size={22} className="text-[#C89B3C]" />
          <div className="flex-1 font-serif text-lg font-bold">Ranked Match</div>
          <button onClick={onClose} aria-label="Schließen" className="p-2 -mr-2 text-slate-300 hover:text-white"><Icon n="x" /></button>
        </div>
        <div className="text-xs text-gray-400">
          Ein Herz geht nur bei Niederlage oder Abbruch verloren. LP werden erst am Ende gebucht. Liga {tierOf(rank.step)}: Du spielst nur {pool[0].difficulty}-Szenarien.
        </div>
        <div className="grid grid-cols-2 gap-2">
          <WayCard active={way === 'match'} icon="swords" title="Match-Simulation" text="Ein echtes Match: zusammenhängende Entscheidungen einer Rolle" onClick={() => setWay('match')} />
          <WayCard active={way === 'quiz'} icon="zap" title="Makro-Quiz" text={`${quizCount} schnelle, unabhängige Situationen aus deiner Liga`} onClick={() => setWay('quiz')} />
        </div>
        {way === 'match' && (
          <div>
            <div className="text-sm font-semibold mb-1.5">Rolle wählen</div>
            <div className="flex flex-wrap gap-2">
              {RANKED_ROLES.map(([l, v]) => <Chip key={l} active={role === v} disabled={!matchPool(v, rank.step).length} onClick={() => setRole(v)}>{l}</Chip>)}
            </div>
            <div className="text-xs text-gray-400 mt-2">Fehler beenden das Match nicht.{picked && picked.difficulty !== pool[0].difficulty ? ` Für diese Rolle gibt es in deiner Liga kein eigenes Match, du spielst das nächstpassende (${picked.difficulty}).` : ''}</div>
          </div>
        )}
        {way === 'quiz' && (
          <div className="text-xs text-gray-400">
            Keine Rollenwahl nötig. {quizCount} Szenarien nacheinander{quizCount < QUIZ_LENGTH ? ` (in deiner Liga gibt es erst ${pool.length})` : ''}, danach das Gesamtergebnis.
          </div>
        )}
        {!way && <div className="text-xs text-gray-500">Wähle einen Weg.</div>}
        <button disabled={!ready} onClick={() => onStart({ way, role })}
          className="flex items-center justify-center gap-2 py-3 rounded-xl bg-[#C89B3C] font-serif font-extrabold text-[#010A13] shadow-[0_0_14px_rgba(200,155,60,.45)] disabled:opacity-40">
          Start
        </button>
      </div>
    </div>
  );
}

function Scenario({ scenario, practice, tag, momentum, timeCap, format = 'tree', stage = 0, stages = 1, record = { c: 0, w: 0 }, onNext, onAbort }) {
  const limit = Math.min(scenario.timeLimit || DEFAULT_TIME_LIMIT, timeCap || Infinity);   // individuelles Zeitlimit pro Szenario
  const [left, setLeft] = useState(limit);
  const [pick, setPick] = useState(null);       // { opt } | { timeout: true } | null
  const [coach, setCoach] = useState(false);
  const [typing, setTyping] = useState(false);
  const [mapOpen, setMapOpen] = useState(false);
  const [leave, setLeave] = useState(false);   // Bestätigung zum Abbrechen
  const [full, setFull] = useState(false);     // Gesamtkarte statt Fokus-Ausschnitt
  const paused = mapOpen || full;               // Taktik-Analyse: Timer steht
  const [showMom, setShowMom] = useState(true);   // Momentum-Banner am Phasenstart
  const [msgs, setMsgs] = useState([{ from: 'coach', t: 'Ich gebe dir Hinweise, aber nie die Lösung. Was willst du wissen?' }]);
  const [draft, setDraft] = useState('');
  const endRef = useRef(null);
  const adv = useRef(false);   // verhindert doppeltes Weiter
  const replyTimer = useRef(null);

  // Timer: pausiert, solange der Coach offen ist
  useEffect(() => {
    if (pick || coach || leave || mapOpen || full) return;   // Timer pausiert bei Coach, Abbruch-Dialog und Karten-Analyse
    if (left <= 0) { setPick({ timeout: true }); return; }
    const t = setTimeout(() => setLeft(l => l - 1), 1000);
    return () => clearTimeout(t);
  }, [left, pick, coach, leave, mapOpen, full]);

  useEffect(() => () => clearTimeout(replyTimer.current), []);
  useEffect(() => { if (pick) setMapOpen(false); }, [pick]);
  useEffect(() => { const t = setTimeout(() => setShowMom(false), 5000); return () => clearTimeout(t); }, []);
  // Auflösung: kurz nach dem Lock-in erklingt Erfolg oder Fehler (bei Timeout sofort)
  useEffect(() => {
    if (!pick) return;
    const t = setTimeout(() => playHextechSound(ok ? 'correct' : 'wrong'), pick.opt ? 260 : 0);
    return () => clearTimeout(t);
  }, [pick]);
  useEffect(() => {
    if (!mapOpen) return;
    const h = e => { if (e.key === 'Escape') setMapOpen(false); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [mapOpen]);
  useEffect(() => { if (coach) endRef.current && endRef.current.scrollIntoView({ block: 'end' }); }, [msgs, typing, coach]);

  const choose = opt => { if (!pick) { playHextechSound('lock_in'); setPick({ opt }); setCoach(false); } };
  const urgent = left <= 5;

  // Dummy-KI: antwortet nach 1,5 s immer mit dem coachHint des aktuellen Szenarios
  const ask = e => {
    e.preventDefault();
    const q = draft.trim();
    if (!q || typing) return;
    setDraft('');
    setMsgs(m => [...m, { from: 'me', t: q }]);
    setTyping(true);
    replyTimer.current = setTimeout(() => {
      setMsgs(m => [...m, { from: 'coach', t: scenario.coachHint || COACH_FALLBACK }]);
      setTyping(false);
    }, 1500);
  };

  const ok = !!pick && !!pick.opt && pick.opt.lpChange > 0;   // richtig = beste Option
  const wrong = !!pick && !ok;                                // falsch oder Timeout -> Screen-Shake
  const fbColor = ok ? 'var(--teal)' : 'var(--red)';
  const fbText = pick ? (pick.opt ? pick.opt.feedback : 'Zeit abgelaufen. Kein Call ist ein Throw.') : '';
  const choice = pick ? (pick.opt ? stripLetter(pick.opt.label) : 'Keine Entscheidung (Zeit abgelaufen)') : '';
  const chain = pick ? ((pick.opt && pick.opt.chain) || TIMEOUT_CHAIN) : null;
  const fx = pick ? effectsFor(pick.opt, scenario, ok) : null;
  const focus = focusFor(scenario.markers);
  const cc = record.c + (ok ? 1 : 0), nn = record.c + record.w + 1, lead = cc - (nn - cc);
  const st = pick ? ((format === 'match' || format === 'tree') ? standing(lead, ok, stage) : { good: ok, text: `Zwischenstand: ${cc} von ${nn} richtig` }) : null;
  const nextLabel = stage + 1 >= stages ? 'Zur Auswertung ➔' : (format === 'match' || format === 'tree') ? 'Nächste Phase ➔' : 'Nächste Frage ➔';
  const goNext = () => { if (adv.current || !pick) return; adv.current = true; onNext(pick.opt || null); };

  return (
    <div className={`flex-1 min-h-0 relative flex flex-col ${wrong ? 'shake' : ''}`}>
      <div className="flex-1 overflow-y-auto p-3 flex flex-col gap-2">
        {/* Spielzeit und Phase in einem Badge */}
        <div className="flex items-center gap-2">
          <div className={`inline-flex min-w-0 items-center gap-2 rounded-lg border bg-[#010A13]/80 px-3 py-1.5 font-serif text-lg font-black text-white ${practice ? 'border-[#0AC8B9]/70' : 'border-[#C89B3C]/60'}`}
               aria-label={`${practice ? 'Übungsmodus, ' : ''}Spielzeit ${scenario.gameTime}, ${tag}`}>
            <Icon n="clock" size={18} className={practice ? 'text-[#0AC8B9]' : 'text-[#C89B3C]'} />
            <span className="tabular-nums leading-none">{scenario.gameTime}</span>
            <span className="text-[#C89B3C]" aria-hidden="true">•</span>
            {practice && <Icon n="target" size={16} className="shrink-0 text-[#0AC8B9]" />}
            <span className="truncate text-sm font-bold leading-none">{tag}</span>
          </div>
          <button onClick={() => setLeave(true)} aria-label="Zurück zum Hauptmenü" title="Zurück zum Hauptmenü"
            className="ml-auto flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-[#C89B3C] text-[#C89B3C] transition hover:bg-[#C89B3C]/15 active:scale-95">
            <Icon n="home" size={18} />
          </button>
        </div>

        {momentum && showMom && !pick && (
          <div role="status" className={`rounded-lg border px-3 py-1.5 text-sm ${momentum.good ? 'border-[#0AC8B9]/60 bg-[#0AC8B9]/10 text-[#0AC8B9]' : 'border-red-500/60 bg-red-500/10 text-red-300'}`}>
            <div className="font-semibold">{momentum.text}</div>
            <div className="text-xs opacity-80">{momentum.state}</div>
          </div>
        )}

        {/* Timer */}
        <div className="flex items-center gap-2">
          <div className="flex-1 h-2 rounded-full overflow-hidden" style={{ background: 'var(--track)' }} role="progressbar" aria-valuenow={left} aria-valuemax={limit}>

        <div className="flex flex-col gap-1.5">

            const chosen = pick && pick.opt === opt;
            return (
              <button key={opt.label} data-silent="true" disabled={!!pick} onClick={() => choose(opt)}

                <span className={`w-7 h-7 shrink-0 rounded-md border flex items-center justify-center text-sm font-extrabold bg-[#0A1428] border-[#C89B3C]/60 text-[#C89B3C] transition-colors ${!pick ? 'group-hover:border-[#0AC8B9] group-hover:text-[#0AC8B9]' : ''}`}>{key}</span>

              <dl className="space-y-1 px-3 py-1.5 text-sm leading-relaxed">
                <div><dt className="inline font-semibold" style={{ color: fbColor }}>Deine Wahl: </dt><dd className="inline text-slate-200">{choice}</dd></div>
                <div><dt className="inline font-semibold" style={{ color: fbColor }}>Direkte Folge: </dt><dd className="inline text-slate-200">{chain[0]}</dd></div>
                <div><dt className="inline font-semibold" style={{ color: fbColor }}>Team-Schaden: </dt><dd className="inline text-slate-200">{chain[1]}</dd></div>
              </dl>
            )}
            {st && (
              <div className="mx-3 mb-2 rounded-md border px-2.5 py-1.5 text-sm font-semibold"
                   style={{ borderColor: st.good ? 'rgba(10,200,185,.5)' : 'rgba(232,64,87,.5)', color: st.good ? 'var(--teal)' : 'var(--red)', background: st.good ? 'rgba(10,200,185,.08)' : 'rgba(232,64,87,.08)' }}>{st.text}</div>

        {pick && (

            <button autoFocus onClick={goNext}
              className="w-full rounded-xl bg-[#C89B3C] py-2.5 font-serif font-extrabold text-[#010A13] shadow-[0_0_12px_rgba(200,155,60,.4)] transition active:scale-[.98]">{nextLabel}</button>
          </div>
        )}

        <div className="flex items-center justify-between mt-auto pt-0.5">
          <div className="text-xs text-slate-400">{practice ? 'Übung: zählt nicht' : 'Ergebnis nach der letzten Entscheidung'}</div>
          <button onClick={() => setCoach(true)} disabled={!!pick}
            className="flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs font-semibold text-[#C89B3C] disabled:opacity-40"
            style={{ borderColor: 'var(--gold)', background: 'var(--panel)' }}>
            <span aria-hidden="true">🐾</span> Ask Poro Coach
          </button>
        </div>
      </div>

      {/* Abbruch-Bestätigung (Timer pausiert) */}
      {leave && (
        <div className="absolute inset-0 z-40 flex items-center justify-center p-5" style={{ background: 'rgba(1,10,19,.88)' }}>
          <div role="alertdialog" aria-modal="true" aria-labelledby="leave-title"
               className="w-full rounded-2xl border border-[#C89B3C]/60 bg-[#06111F] p-4 flex flex-col gap-3 text-center">
            <div id="leave-title" className="font-serif text-lg font-bold">Zurück zum Dashboard?</div>
            <div className="text-sm text-slate-300">
              Dein aktueller Fortschritt geht verloren und es werden keine LP gewertet.{!practice && ' Du verlierst dafür 1 Herz.'}
            </div>
            <div className="grid grid-cols-2 gap-2">
              <button autoFocus onClick={() => setLeave(false)}
                className="rounded-xl border border-[#C89B3C]/60 py-2.5 font-serif font-bold transition hover:border-[#0AC8B9]">Weiterspielen</button>
              <button onClick={onAbort} className="rounded-xl bg-[#C89B3C] py-2.5 font-serif font-extrabold text-[#010A13]">Ja, abbrechen</button>
            </div>
          </div>
        </div>
      )}

      {/* Karten-Modal (Timer läuft weiter) */}
      {mapOpen && (
        <div className="absolute inset-0 z-30 flex flex-col p-4 gap-3" style={{ background: 'rgba(5,10,20,.96)' }}>
          <div className="flex items-center gap-3" role="dialog" aria-modal="true" aria-label="Taktik-Karte">
            <div className="font-bold flex-1">Taktik-Karte · {scenario.gameTime}</div>
            <div className={`flex items-center gap-1 font-extrabold tabular-nums ${urgent ? 'text-[#E84057]' : ''}`}><Icon n="timer" size={16} /> {left}s</div>
            <button onClick={() => setMapOpen(false)} aria-label="Karte schließen" className="p-2 -mr-2 text-slate-300 hover:text-white"><Icon n="x" /></button>
          </div>
          <div role="status" className="rounded-md border border-[#C89B3C]/50 bg-[#C89B3C]/10 px-2 py-1 text-center text-xs font-semibold text-[#C89B3C]">⏸️ Taktik-Analyse (Timer pausiert)</div>
          <div className="w-full max-w-[380px] aspect-square mx-auto rounded-xl overflow-hidden border border-[#C89B3C]/40 bg-[#010A13]">
            <Minimap markers={scenario.markers} champion={scenario.champion} role={scenario.role} showLabels focus={focus} full={full} onToggleView={() => setFull(f => !f)} />
          </div>
          <div className="flex flex-wrap justify-center gap-x-4 gap-y-1 text-xs text-gray-300">
            {[['hero', 'Du / Team'], ['enemy', 'Gegner'], ['objective', 'Objective'], ['fog', 'Ungesichtet']].map(([t, l]) => (
              <span key={t} className="flex items-center gap-1.5">
                <span className="w-3 h-3 rounded-full" style={t === 'fog' ? { border: '1.5px dashed #94a3b8' } : t === 'objective' ? { border: `2px solid ${MARKER_COLOR[t]}` } : { background: MARKER_COLOR[t] }} />{l}
              </span>
            ))}
          </div>
          {scenario.markers.some(m => m.type === 'fog') && (
            <div className="rounded-lg border border-dashed border-slate-500/60 px-3 py-2 text-xs text-slate-300">
              {scenario.markers.filter(m => m.type === 'fog').map(m => <div key={m.label}><span className="font-bold text-slate-200">?</span> {m.label}</div>)}
            </div>
          )}
          <div className="rounded-lg border border-[#C89B3C]/40 bg-[#010A13]/80 p-3 text-sm leading-relaxed overflow-y-auto">{scenario.context}</div>
        </div>
      )}

      {/* Coach-Modal */}
      {coach && (
        <div className="absolute inset-0 z-30 flex flex-col justify-end" style={{ background: 'rgba(5,10,20,.75)' }}>
          <div role="dialog" aria-modal="true" aria-label="Poro Coach"
               className="h-[78%] flex flex-col rounded-t-2xl border-t" style={{ background: '#06111F', borderColor: 'var(--gold)' }}>
            <div className="flex items-center gap-2 px-4 py-3 border-b" style={{ borderColor: 'var(--line)' }}>
              <span className="text-xl" aria-hidden="true">🐹</span>
              <div className="flex-1 min-w-0">
                <div className="font-serif font-bold leading-tight">Poro Coach</div>
                <div className="text-xs text-[#C89B3C]">Timer pausiert bei {left}s</div>
              </div>
              <button onClick={() => setCoach(false)} aria-label="Coach schließen" className="p-2 -mr-2 text-slate-300 hover:text-white"><Icon n="x" /></button>
            </div>

            <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
              {msgs.map((m, i) => (
                <div key={i} className={`max-w-[85%] rounded-lg px-3 py-2 text-sm leading-relaxed ${m.from === 'me' ? 'self-end' : 'self-start'}`}
                     style={{ background: m.from === 'me' ? '#1A2A48' : 'var(--bg)' }}>{m.t}</div>
              ))}
              {typing && (
                <div className="self-start rounded-lg px-3 py-2 text-sm text-slate-400 italic" style={{ background: 'var(--bg)' }} role="status">Coach tippt...</div>
              )}
              <div ref={endRef} />
            </div>

            <form onSubmit={ask} className="flex gap-2 p-3 border-t" style={{ borderColor: 'var(--line)' }}>
              <input value={draft} onChange={e => setDraft(e.target.value)} placeholder="Frag den Coach..." autoFocus
                className="flex-1 min-w-0 rounded-lg border px-3 py-2.5 text-sm bg-transparent placeholder:text-slate-500" style={{ borderColor: 'var(--line)' }} />
              <button type="submit" aria-label="Senden" disabled={!draft.trim() || typing}
                className="px-3.5 rounded-lg text-[#0A1428] disabled:opacity-40" style={{ background: 'var(--gold)' }}><Icon n="send" size={18} /></button>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

const CONFETTI_COLORS = ['#f5d36b', '#C89B3C', '#3b82f6', '#0AC8B9', '#E84057', '#b86bff'];
const Confetti = () => (
  <div className="pointer-events-none absolute inset-0 overflow-hidden z-10" aria-hidden="true">
    {Array.from({ length: 28 }, (_, i) => (
      <span key={i} className="confetti" style={{
        left: `${(i * 37) % 100}%`, background: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
        animationDelay: `${(i % 7) * 0.12}s`, animationDuration: `${2.4 + (i % 5) * 0.35}s` }} />
    ))}
  </div>
);

const StepList = ({ log }) => (
  <div className="w-full flex flex-col gap-2 text-left">
    {log.map((e, i) => (
      <div key={i} className="rounded-lg border p-2.5 text-sm" style={{ background: 'var(--panel)', borderColor: e.ok ? 'rgba(10,200,185,.45)' : 'rgba(232,64,87,.45)' }}>
        <div className="flex items-start justify-between gap-3">
          <div className="min-w-0">
            <div className="text-[11px] uppercase tracking-wide text-slate-500">{e.title}</div>
            <div className="font-semibold">{e.text}</div>
          </div>
          <span className={`shrink-0 text-lg font-black leading-none ${e.ok ? 'text-[#0AC8B9]' : 'text-[#E84057]'}`} aria-label={e.ok ? 'richtig' : 'falsch'}>{e.ok ? '✔' : '✖'}</span>
        </div>
        {e.ok ? <div className="mt-1 text-slate-400">{e.feedback}</div> : (
          <dl className="mt-1.5 space-y-1 text-xs">
            {e.chain && <div><dt className="inline font-semibold text-slate-300">Direkte Folge: </dt><dd className="inline text-slate-400">{e.chain[0]}</dd></div>}
            {e.chain && <div><dt className="inline font-semibold text-slate-300">Team-Schaden: </dt><dd className="inline text-slate-400">{e.chain[1]}</dd></div>}
            {e.best && <div><dt className="inline font-semibold text-[#0AC8B9]">Besser wäre: </dt><dd className="inline text-slate-300">{e.best}</dd></div>}
          </dl>
        )}
      </div>
    ))}
  </div>
);

function RunComplete({ result, log, practice, format, onDone, onRetry }) {
  useEffect(() => {
    const timers = [];
    if (result.drill) playHextechSound(result.passed ? 'correct' : 'wrong');
    else {
      const promo = !practice && result.to.step > result.from.step;
      playHextechSound(result.win ? (promo ? 'promotion' : 'victory') : 'defeat');
      if (!practice && result.heartLost) timers.push(setTimeout(() => playHextechSound('heart_loss'), 1100));
    }
    return () => timers.forEach(clearTimeout);
  }, []);
  const unit = format === 'match' ? 'Match' : format === 'quiz' ? 'Quiz' : format === 'mastery' ? 'Mastery' : format === 'drill' ? 'Drill' : 'Run';

  if (result.drill) {
    return (
      <div className="flex-1 overflow-y-auto p-4 flex flex-col items-center gap-3 text-center">
        <div className="pt-3">
          <div className={`pop font-serif text-3xl font-black ${result.passed ? 'text-[#0AC8B9]' : 'text-[#E84057]'}`}>{result.passed ? 'Drill bestanden!' : 'Nicht bestanden'}</div>
          <div className="mt-1 text-sm text-slate-400">Recovery Drill · {result.correct}/{result.n} richtig</div>
        </div>
        <div className="w-full"><Divider /></div>
        {result.passed ? (
          <div className="flex items-center gap-2 rounded-xl border border-red-500/60 bg-red-500/10 px-5 py-3 font-serif text-lg font-bold text-red-300">
            <Icon n="heart" size={22} fill="currentColor" /> +1 Herz zurück
          </div>
        ) : <div className="text-sm text-slate-300">Beide Fragen müssen richtig sein. Ein neuer Versuch kostet nichts.</div>}
        <StepList log={log} />
        {!result.passed && <button onClick={onRetry} className="w-full rounded-xl bg-[#C89B3C] py-3 font-serif font-extrabold text-[#010A13]">Nochmal versuchen</button>}
        <button onClick={onDone} className="w-full rounded-xl border border-[#C89B3C]/60 py-3 font-serif font-bold">Weiter zum Dashboard</button>
      </div>
    );
  }

  const win = result.win;
  const color = win ? 'var(--teal)' : 'var(--red)';
  const to = result.to;
  const promoted = !practice && to.step > result.from.step;
  const demoted = !practice && to.step < result.from.step;
  const newLeague = promoted && tierOf(to.step) !== tierOf(result.from.step);
  const cls = to && RANK_ICON[tierOf(to.step)].cls;
  const toGo = to && to.step < MAX_STEP ? 100 - to.lp : null;   // Challenger hat kein Ziel mehr

  return (
    <div className="flex-1 min-h-0 relative flex flex-col">
      {promoted && <Confetti />}
      <div className="flex-1 overflow-y-auto p-4 flex flex-col items-center gap-3 text-center">
        <div className="pt-2">
          <div className="pop font-serif text-4xl font-black tracking-wide" style={{ color }}>{win ? 'VICTORY' : 'DEFEAT'}</div>
          <div className="mt-1 font-serif text-lg font-bold text-white">{result.kind}</div>
          <div className="text-xs text-slate-400">{unit} Complete · {result.correct} von {result.n} richtig</div>
        </div>
        <div className="rounded-xl border px-8 py-3" style={{ background: 'var(--panel)', borderColor: practice ? 'var(--line)' : color }}>
          {practice ? (
            <div className="text-lg font-extrabold" style={{ color }}>Das wären {fmt(result.lp)} LP gewesen</div>
          ) : (
            <>
              <div className="text-4xl font-black tabular-nums" style={{ color }}>{fmt(result.lp)} LP</div>
              <div className={`mt-1 text-sm font-semibold tabular-nums ${result.mmrDelta > 0 ? 'text-[#0AC8B9]' : 'text-[#E84057]'}`}>
                MMR {fmt(result.mmrDelta)} {result.mmrDelta > 0 ? '▲' : '▼'}
              </div>
              <div className={`mt-1 flex items-center justify-center gap-1 text-xs ${result.heartLost ? 'text-red-300' : 'text-slate-400'}`}>
                <Icon n="heart" size={12} fill={result.heartLost ? 'currentColor' : 'none'} /> {result.heartLost ? '−1 Herz' : 'Kein Herz verloren'}
              </div>
            </>
          )}
        </div>

        {practice ? (
          <div className="text-sm text-slate-400">Dein Rang und deine Historie bleiben unverändert.</div>
        ) : (
          <div className="w-full flex flex-col items-center gap-2 rounded-xl border p-3" style={{ background: 'var(--panel)', borderColor: 'var(--line)' }}>
            <div className="relative w-20 h-20 flex items-center justify-center">
              {promoted && <span className="rankglow absolute inset-0 rounded-full bg-yellow-400/50 blur-xl" aria-hidden="true" />}
              <span className="relative"><RankIcon tier={tierOf(to.step)} size={56} /></span>
            </div>
            {promoted && <div className="pop font-black text-yellow-300">{newLeague ? `Neue Liga: ${rankName(to.step)}!` : 'Aufstieg!'}</div>}
            {demoted && <div className="font-bold text-red-400">Abstieg in {rankName(to.step)} mit {to.lp} LP</div>}
            {result.event === 'shield' && (
              <div className="flex items-center gap-1.5 rounded-lg border border-[#0AC8B9]/60 bg-[#0AC8B9]/10 px-3 py-1.5 text-xs font-semibold text-[#0AC8B9]" role="status">
                <Icon n="shield" size={14} /> Demotion Shield aktiv: Eine weitere Niederlage bei 0 LP führt zum Abstieg.
              </div>
            )}
            <div className="text-sm text-slate-300">
              Aktueller Rang: <span className={`font-bold ${cls}`}>{rankName(to.step)}</span> <span className="tabular-nums text-slate-400">({to.lp} LP)</span>
            </div>
            <div className="w-full h-2 rounded-full overflow-hidden" style={{ background: 'var(--track)' }}>
              <div className={`h-full rounded-full bg-current ${cls}`} style={{ width: `${Math.min(100, to.lp)}%` }} />
            </div>
            {toGo !== null && <div className="text-sm font-semibold text-slate-100">Noch {toGo} LP bis {rankName(to.step + 1)}</div>}
          </div>
        )}

        <div className="w-full"><Divider /></div>
        <div className="font-serif text-lg font-bold">Post-Match Breakdown</div>
        <StepList log={log} />
        <button onClick={onDone} className="w-full py-3 rounded-xl font-serif font-extrabold text-[#010A13]" style={{ background: 'var(--gold)' }}>Weiter zum Dashboard</button>
      </div>
    </div>
  );
}

    <div className="absolute inset-0 z-40 flex items-end justify-center p-3" style={{ background: 'rgba(1,10,19,.85)' }} onClick={onClose}>
      <div role="dialog" aria-modal="true" aria-label="Keine Herzen mehr" onClick={e => e.stopPropagation()}
           className="w-full rounded-2xl border border-red-500/60 bg-[#06111F] p-4 flex flex-col gap-3">
        <div className="flex items-center gap-2">
          <Icon n="heart" size={22} className="text-red-500" />
          <div className="flex-1 font-serif text-lg font-bold">Keine Herzen mehr</div>
          <button onClick={onClose} aria-label="Schließen" className="p-2 -mr-2 text-slate-300 hover:text-white"><Icon n="x" /></button>
        </div>

/* ---------- Account, Profil, Champion Mastery ---------- */
const STATUS = { online: { emoji: '🟢', label: 'Online' }, match: { emoji: '🟡', label: 'Im Match' }, away: { emoji: '🔴', label: 'Away / AFK' } };
const ROLES = [['Top', 'Toplane'], ['Jungle', 'Jungle'], ['Mid', 'Midlane'], ['Bot', 'Botlane'], ['Support', 'Support']];
const normName = n => (n || '').toLowerCase().replace(/[^a-z]/g, '');
const masteryPool = (champ, role) => RUNS.filter(r => normName(r.champion) === normName(champ) && r.role === role);
const CHAMP_NAMES = [...new Set(RUNS.map(r => r.champion))].sort();
const escapeRe = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const titleCase = n => n.trim().split(/\s+/).filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1).toLowerCase()).join(' ');
const champLabel = n => CHAMP_NAMES.find(c => normName(c) === normName(n)) || titleCase(n || '') || 'Champion';

// Adaptives Rollen-Template: Szenarien ohne champion-spezifische Fähigkeiten, die für jeden Champion der Rolle passen
const GENERIC = {
  Toplane: ['top_smaragd_01', 'top_smaragd_02', 'top_smaragd_03', 'top_smaragd_05', 'top_bronze_02', 'top_bronze_03', 'top_bronze_04', 'quiz_eisen_01', 'quiz_gold_01', 'quiz_diamant_01',
    'quiz_silber_01', 'quiz_gold_04', 'quiz_gold_06', 'quiz_diamant_06', 'quiz_master_02', 'quiz_master_03'],
  Jungle: ['jng_dia_01', 'jng_dia_02', 'jng_dia_03', 'jng_dia_04', 'jng_dia_05', 'jng_platin_01', 'jng_platin_02', 'jng_platin_04', 'quiz_gold_03',
    'quiz_eisen_04', 'quiz_eisen_06', 'quiz_bronze_04', 'quiz_platin_02', 'quiz_smaragd_06'],
  Midlane: ['mid_gold_02', 'mid_gold_03', 'mid_gold_04', 'mid_gold_05', 'mid_master_01', 'mid_master_03', 'mid_master_05', 'quiz_eisen_02', 'quiz_smaragd_01', 'quiz_diamant_02',
    'quiz_eisen_05', 'quiz_bronze_03', 'quiz_silber_02', 'quiz_platin_03', 'quiz_smaragd_05', 'quiz_diamant_04', 'quiz_master_04'],
  Botlane: ['bot_eisen_01', 'bot_eisen_02', 'bot_eisen_03', 'bot_eisen_04', 'bot_eisen_05', 'quiz_eisen_03', 'quiz_smaragd_03', 'quiz_diamant_03',
    'quiz_bronze_02', 'quiz_gold_05', 'quiz_platin_04', 'quiz_smaragd_04', 'quiz_diamant_05'],
  Support: ['sup_silber_02', 'sup_silber_03', 'quiz_gold_02', 'quiz_smaragd_02', 'quiz_bronze_01', 'quiz_platin_01', 'quiz_master_01', 'quiz_silber_03'],
};
function adaptScenario(sc, champ) {
  const from = new RegExp(escapeRe(sc.champion), 'g');
  const sub = t => t.replace(from, champ);
  const out = { ...sc, id: `${sc.id}~${normName(champ)}`, champion: champ, context: sub(sc.context), coachHint: sub(sc.coachHint),
    markers: sc.markers.map(m => ({ ...m, label: sub(m.label) })),
    options: sc.options.map(o => ({ ...o, label: sub(o.label), feedback: sub(o.feedback), chain: o.chain && o.chain.map(sub), nextId: 'end' })) };
  delete out.phase;
  DYN[out.id] = out;
  return out;
}
// Mastery für jeden Champion: handgeschriebenes Set, wenn es mindestens 5 Szenarien hat, sonst ergänzt um adaptive Rollen-Szenarien
function masteryScenarios(champ, role) {
  const name = champLabel(champ);
  const own = RUNS.filter(r => normName(r.champion) === normName(name) && r.role === role);
  if (own.length >= QUIZ_LENGTH) return own;
  const clash = new RegExp('\\b' + escapeRe(name) + '\\b', 'i');   // Champion kommt schon als Gegner im Text vor: überspringen
  const adaptive = (GENERIC[role] || []).map(id => RUNS.find(r => r.id === id))
    .filter(sc => sc && normName(sc.champion) !== normName(name) && !clash.test(JSON.stringify(sc)))
    .map(sc => adaptScenario(sc, name));
  return [...own, ...adaptive];
}

                {r.me && profile.note && <div className="truncate text-xs italic text-gray-400">„{profile.note}“</div>}
              </div>
              <div className={`font-bold tabular-nums ${r.me ? 'text-[#C89B3C]' : ''}`}>{r.lp} LP</div>
            </div>
          ))}
        </>
      ) : (
        <>
          <div className="font-serif font-bold text-lg my-1">Freunde-Leaderboard</div>
          <div className="rounded-lg border border-[#C89B3C]/40 bg-[#010A13]/80 px-3 py-2 text-sm text-gray-300 mb-1">
            {friends.length === 0 ? 'Noch keine Freunde. Füge im Profil welche hinzu, um dich zu vergleichen.'
              : crewTarget ? <>Dein Platz: <span className="font-bold text-white">{crewMe + 1}</span> von {crew.length}. Nächstes Ziel: <span className="font-bold text-white">{crewTarget.name}</span>, noch <span className="font-bold text-[#C89B3C] tabular-nums">{Math.max(1, Math.ceil(crewTarget.score - myScore))} LP</span> bis zum Überholen.</>
              : <>Du führst deine Freundesliste an.</>}
          </div>
          {crew.map((r, i) => (
            <div key={r.name} ref={r.me ? meRef : null} className={rowCls(r.me)}>
              <Pos n={i + 1} />
              <span className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border border-[#C89B3C]/40 bg-[#010A13]"><RankIcon tier={tierOf(r.step)} size={20} /></span>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2">
                  <span aria-label={STATUS[r.status].label}>{STATUS[r.status].emoji}</span>
                  <span className={`truncate ${r.me ? 'font-extrabold text-white' : 'font-semibold'}`}>{r.name}</span>
                  {r.me && <span className="shrink-0 rounded px-1.5 py-0.5 text-[10px] font-extrabold text-[#010A13] bg-[#C89B3C]">DU</span>}
                </div>
                <div className="truncate text-xs text-gray-400">{rankName(r.step)} · {r.lp} LP{r.note ? ` · „${r.note}“` : ''}</div>
              </div>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

function Premium({ hearts, onRefill }) {
  const [refilled, setRefilled] = useState(false);
  const perks = ['Keine Werbung', 'Unbegrenzte Coach-Fragen', 'OP.GG-Replay-Analyse (später)'];
  return (
    <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
      <div className="text-center pt-4">
        <Icon n="crown" size={44} className="mx-auto text-[#C89B3C]" />
        <div className="font-serif text-2xl font-black mt-2">BrainGap Premium</div>
        <div className="text-slate-400 text-sm">Trainiere ohne Limit.</div>
      </div>
      <div className="rounded-lg border p-4 flex flex-col gap-3" style={{ background: 'var(--panel)', borderColor: 'var(--gold)' }}>
        {perks.map(p => <div key={p} className="flex items-center gap-2"><Icon n="check" size={18} className="text-[#0AC8B9]" />{p}</div>)}
        <div className="text-center mt-2"><span className="text-3xl font-black">2 €</span><span className="text-slate-400"> / Monat</span></div>
        <button className="py-3 rounded-lg font-serif font-extrabold text-[#010A13]" style={{ background: 'var(--gold)' }}>Premium freischalten</button>
      </div>
      <button onClick={() => { onRefill(); setRefilled(true); }} className="rounded-lg border py-3 font-semibold text-[#0AC8B9]" style={{ borderColor: 'var(--teal)' }}>
        Werbung ansehen
        <span className="block text-xs font-normal text-slate-400">Test: füllt deine Herzen sofort auf {MAX_HEARTS} (Ghost-Buff folgt)</span>
      </button>
      {refilled && <div role="status" className="text-sm text-center text-red-400">Herzen aufgefüllt: {hearts}/{MAX_HEARTS}</div>}
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [init] = useState(() => loadSave() || { rank: { step: 0, lp: 0 }, history: [] });  // Rang und Profil kommen aus dem Onboarding
  const [screen, setScreen] = useState('home');   // home | scenario | complete | board | premium
  const [mode, setMode] = useState('daily');      // 'daily' | 'ranked' | 'practice'
  const [setupOpen, setSetupOpen] = useState(false);
  const [rankedOpen, setRankedOpen] = useState(false);
  const [heartsOpen, setHeartsOpen] = useState(false);
  const [profile, setProfile] = useState(init.profile || null);   // null = noch nicht registriert
  const [friends, setFriends] = useState(init.friends || [MOCK_FRIEND]);
  const [requests, setRequests] = useState(init.requests || MOCK_REQUESTS);
  const [recent, setRecent] = useState(init.recent || []);   // zuletzt gespielte Szenario-IDs
  const [infoMode, setInfoMode] = useState(null);
  const [rank, setRank] = useState(init.rank);
  const [history, setHistory] = useState(init.history);
  const [hearts, setHearts] = useState(Number.isInteger(init.hearts) ? Math.max(0, Math.min(MAX_HEARTS, init.hearts)) : MAX_HEARTS);
  const [run, setRun] = useState(0);
  // format: 'tree' (Daily, Übung), 'match' (Ranked: Match-Simulation), 'quiz' (Ranked: Makro-Quiz)
  const [rs, setRs] = useState({ id: START_IDS[0], format: 'tree', correct: 0, log: [], champion: '', role: '', stage: 0, stages: 1, queue: [] });
  const [result, setResult] = useState(null);     // { from, to } bei Daily und Ranked

  useEffect(() => { writeSave({ rank, history, hearts, profile, friends, requests, recent }); }, [rank, history, hearts, profile, friends, requests, recent]);

  // Jeder Button klickt (Optionen ausgenommen: sie lösen lock_in aus)
  useEffect(() => {
    const onClick = e => {
      const b = e.target && e.target.closest ? e.target.closest('button,[role="button"]') : null;
      if (b && !b.disabled && !b.hasAttribute('data-silent')) playHextechSound('click');
    };
    document.addEventListener('click', onClick);
    return () => document.removeEventListener('click', onClick);
  }, []);

  // Startet einen Lauf. Ein Herz kostet nur eine Niederlage oder ein Abbruch, nicht der Start.
  const begin = (nextMode, cfg) => {
    const sc = getScenario(cfg.id);
    setMode(nextMode); setRun(n => n + 1); setResult(null); setSetupOpen(false); setRankedOpen(false); setHeartsOpen(false);
    setRs({ format: 'tree', correct: 0, log: [], champion: sc.champion, role: sc.role, stage: 0, stages: matchStages(cfg.id), queue: [], ...cfg });
    setScreen('scenario');
  };
  const canPlay = hearts > 0;
  const playDaily = () => { if (canPlay) begin('daily', { id: dailyStartId() }); };
  const playPractice = ({ role, difficulty }) => {
    const pool = practicePool(role, difficulty);
    if (pool.length) begin('practice', { id: pickRandom(freshStarts(pool, recent)).id });
  };
  const playRanked = ({ way, role }) => {
    if (!canPlay) return;
    if (way === 'match') {
      const pool = matchPool(role, rank.step);
      if (pool.length) { const sc = pickRandom(freshStarts(pool, recent)); begin('ranked', { format: 'match', id: sc.id, stages: matchStages(sc.id) }); }
    } else {
      const queue = freshFirst(rankedPool(rank.step).map(r => r.id), recent, QUIZ_LENGTH);   // nur eigene Liga, ohne zuletzt gespielte
      begin('ranked', { format: 'quiz', id: queue[0], queue, stages: queue.length });
    }
  };

  const mmr = profile && profile.hiddenMmr != null ? profile.hiddenMmr : rank.step * 100 + rank.lp;

  const next = opt => {
    const cur = getScenario(rs.id);
    const ok = !!opt && opt.lpChange > 0;                 // richtig = beste Option, keine LP pro Phase
    setRecent(r => [baseId(cur.id), ...r.filter(x => x !== baseId(cur.id))].slice(0, RECENT_MAX));
    const best = cur.options.find(o => o.lpChange > 0);
    const log = [...rs.log, {
      title: rs.format === 'match' || rs.format === 'tree' ? `Phase ${rs.stage + 1}: ${cur.phase} (${cur.gameTime})` : `Frage ${rs.stage + 1}: ${cur.champion} (${cur.gameTime})`,
      text: opt ? stripLetter(opt.label) : 'Keine Entscheidung (Zeit abgelaufen)',
      feedback: opt ? opt.feedback : 'Zeit abgelaufen.',
      ok, chain: opt ? (opt.chain || null) : TIMEOUT_CHAIN, best: ok || !best ? null : stripLetter(best.label),
    }];
    const correct = rs.correct + (ok ? 1 : 0);

    let nextId = null;                                    // null = Lauf beendet
    if (rs.queue.length) nextId = rs.queue[rs.stage + 1] || null;   // Quiz, Mastery, Drill: feste Frageliste
    else {
      nextId = opt ? opt.nextId : mainLine(cur);          // Timeout wirkt wie eine Fehlentscheidung: das Spiel geht weiter
      if (nextId === 'end' || !getScenario(nextId)) nextId = null;
    }
    if (nextId) { setRs({ ...rs, id: nextId, stage: rs.stage + 1, correct, log }); return; }

    // Endabrechnung nach der letzten Entscheidung
    const n = log.length;
    if (rs.format === 'drill') {
      const passed = correct === n;
      if (passed) setHearts(h => Math.min(MAX_HEARTS, h + 1));
      setResult({ drill: true, passed, correct, n });
    } else {
      const v = scoreRun(correct, n, mmr, rank);
      if (mode !== 'practice') {   // Übungsmodus: nichts aufs Profil, nichts in die Historie
        const { event, ...to } = applyLp(rank, v.lp);
        const heartLost = !v.win;                         // Siege kosten kein Herz, Niederlagen genau eines
        setRank(to);
        updateProfile({ hiddenMmr: mmr + v.mmrDelta });
        if (heartLost) setHearts(h => Math.max(0, h - 1));
        setHistory(h => [{
          champion: rs.format === 'quiz' ? 'Makro-Quiz' : rs.champion,
          role: rs.format === 'quiz' ? `${rs.queue.length} Szenarien` : rs.format === 'mastery' ? `Mastery · ${rs.role}` : rs.format === 'match' ? `${rs.role} · Match` : rs.role,
          lp: v.lp, ts: Date.now() }, ...h].slice(0, 20));
        setResult({ ...v, correct, n, from: rank, to, event, heartLost });
      } else setResult({ ...v, correct, n, from: rank, to: rank });
    }
    setRs({ ...rs, correct, log });
    setScreen('complete');
  };

  // Abbruch während eines Laufs: kein LP-Eintrag, keine Historie, zurück ins Hauptmenü
  const abort = () => {
    if (mode !== 'practice') { setHearts(h => Math.max(0, h - 1)); playHextechSound('heart_loss'); }   // Aufgeben nimmt 1 Herz
    setRs({ id: START_IDS[0], format: 'tree', correct: 0, log: [], champion: '', role: '', stage: 0, stages: 1, queue: [] });
    setResult(null); setSetupOpen(false); setRankedOpen(false);
    setScreen('home');
  };

  const playMastery = () => {
    if (!canPlay || !profile) return;
    const pool = masteryScenarios(profile.champion, profile.role);   // eigenes Set oder adaptives Rollen-Template
    if (!pool.length) return;
    const queue = freshFirst(pool.map(r => r.id), recent, QUIZ_LENGTH);
    begin('ranked', { format: 'mastery', id: queue[0], queue, stages: queue.length });
  };

  // Recovery Drill: 2 kurze Fragen aus der eigenen Liga, beide richtig = 1 Herz zurück (kostenlos, wiederholbar)
  const startDrill = () => {
    const queue = freshFirst(rankedPool(rank.step).map(r => r.id), recent, 2);
    begin('practice', { format: 'drill', id: queue[0], queue, stages: queue.length });
  };

  const register = ({ name, step, role, champion }) => {
    setProfile({ name, role, champion, status: 'online', note: '', startStep: step, hiddenMmr: step * 100 + 50 });
    setRank({ step, lp: 0 }); setHistory([]); setHearts(MAX_HEARTS); setFriends([MOCK_FRIEND]); setRequests(MOCK_REQUESTS); setScreen('home');
  };
  // Anfrage annehmen: Spieler wandert in die Freundesliste (und damit ins Freunde-Leaderboard)
  const acceptRequest = name => {
    const r = requests.find(x => x.name === name);
    if (!r) return;
    setFriends(l => (l.some(f => f.name === name) || l.length >= 20) ? l : [...l, { name: r.name, step: r.step, lp: r.lp, status: r.status, note: r.note }]);
    setRequests(l => l.filter(x => x.name !== name));
    playHextechSound('correct');
  };
  const declineRequest = name => setRequests(l => l.filter(x => x.name !== name));
  const updateProfile = patch => setProfile(p => ({ ...p, ...patch }));
  const logout = () => { setProfile(null); setScreen('home'); };

  const reset = () => { setRank({ step: profile && profile.startStep ? profile.startStep : 0, lp: 0 }); setHistory([]); setHearts(MAX_HEARTS); };

  const scenario = getScenario(rs.id);
  const phaseTag = scenario ? `${scenario.phase} (${rs.stage + 1}/${rs.stages})` : '';
  const tag = rs.format === 'quiz' ? `Quiz (${rs.stage + 1}/${rs.stages})` : rs.format === 'mastery' ? `Mastery (${rs.stage + 1}/${rs.stages})`
    : rs.format === 'drill' ? `Recovery Drill (${rs.stage + 1}/${rs.stages})` : phaseTag;
  const momentum = (rs.format === 'match' || rs.format === 'tree') && rs.stage > 0 && rs.log.length ? makeMomentum(rs.log, rs.stage) : null;
  const tabs = [['home', 'home', 'Home'], ['board', 'trophy', 'Leaderboard'], ['profile', 'user', 'Profil'], ['premium', 'crown', 'Premium']];

  if (!profile) {   // Erster Start: Registrierung
    return (
      <div className="relative mx-auto w-full max-w-[400px] h-full max-h-[820px] flex flex-col overflow-hidden sm:my-4 sm:rounded-3xl sm:border bg-gradient-to-b from-[#010A13] to-[#0A1428]"
           style={{ borderColor: 'var(--line)' }}>
        <header className="px-4 py-2.5 border-b flex items-center gap-2" style={{ borderColor: 'var(--line)' }}>
          <ChampAvatar name="Heimerdinger" className="w-8 h-8" iconSize={16} fallbackIcon="brain" ring="border border-[#C89B3C]" />
          <div className="font-serif font-extrabold tracking-wide">BrainGap<span className="text-[#C89B3C]">.gg</span></div>
        <div className="ml-auto"><SoundToggle /></div>
        </header>
        <Onboarding onDone={register} />
      </div>
    );
  }

  return (
    <div className="relative mx-auto w-full max-w-[400px] h-full max-h-[820px] flex flex-col overflow-hidden sm:my-4 sm:rounded-3xl sm:border bg-gradient-to-b from-[#010A13] to-[#0A1428]"
         style={{ borderColor: 'var(--line)' }}>
      <header className="px-4 py-2.5 border-b flex items-center gap-2" style={{ borderColor: 'var(--line)' }}>
        <ChampAvatar name="Heimerdinger" className="w-8 h-8" iconSize={16} fallbackIcon="brain" ring="border border-[#C89B3C]" />
        <div className="font-serif font-extrabold tracking-wide">BrainGap<span className="text-[#C89B3C]">.gg</span></div>
        <div className="ml-auto flex items-center gap-2"><Hearts n={hearts} /><SoundToggle /></div>
      </header>

      {(screen === 'home' || screen === 'board' || screen === 'profile' || screen === 'premium') && (
        <div key={screen} className="fade-in flex-1 min-h-0 flex flex-col">
          {screen === 'home' && <Dashboard rank={rank} history={history} hearts={hearts} profile={profile} onDaily={playDaily} onRanked={() => setRankedOpen(true)}
            onPractice={() => setSetupOpen(true)} onMastery={playMastery} onInfo={setInfoMode} onNoHearts={() => setHeartsOpen(true)} onShop={() => setScreen('premium')} onReset={reset} />}
          {screen === 'board' && <Leaderboard rank={rank} profile={profile} friends={friends} />}
          {screen === 'profile' && <Profile profile={profile} rank={rank} friends={friends} onChange={updateProfile} onLogout={logout}
            onAddFriend={f => setFriends(l => [...l, f])} onRemoveFriend={name => setFriends(l => l.filter(x => x.name !== name))}
            requests={requests} onAccept={acceptRequest} onDecline={declineRequest} />}
          {screen === 'premium' && <Premium hearts={hearts} onRefill={() => setHearts(MAX_HEARTS)} />}
        </div>
      )}
      {screen === 'scenario' && scenario && (
        <Scenario key={`${run}-${scenario.id}-${rs.stage}`} scenario={scenario} practice={mode === 'practice'}
          tag={tag} momentum={momentum} timeCap={rs.format === 'drill' ? 30 : null} format={rs.format} stage={rs.stage} stages={rs.stages}
          record={{ c: rs.log.filter(e => e.ok).length, w: rs.log.filter(e => !e.ok).length }} onNext={next} onAbort={abort} />
      )}
      {screen === 'complete' && result && <RunComplete result={result} log={rs.log} practice={mode === 'practice'} format={rs.format} onDone={() => setScreen('home')} onRetry={startDrill} />}

      {screen !== 'scenario' && screen !== 'complete' && (
        <nav className="grid grid-cols-4 border-t" style={{ borderColor: 'var(--line)', background: '#010A13' }}>
          {tabs.map(([id, ic, label]) => (
            <button key={id} onClick={() => setScreen(id)} aria-current={screen === id}
              className={`py-3 flex flex-col items-center gap-1 text-xs ${screen === id ? 'text-[#0AC8B9]' : 'text-slate-500'}`}>
              <span className="relative"><Icon n={ic} size={22} />{id === 'profile' && requests.length > 0 && <span className="absolute -right-2 -top-1.5 rounded-full bg-red-500 px-1 text-[9px] font-bold leading-3 text-white" aria-label={`${requests.length} offene Anfragen`}>{requests.length}</span>}</span>{label}
            </button>
          ))}
        </nav>
      )}

      {setupOpen && <PracticeSetup onStart={playPractice} onClose={() => setSetupOpen(false)} />}
      {rankedOpen && <RankedSetup rank={rank} onStart={playRanked} onClose={() => setRankedOpen(false)} />}
      {infoMode && <ModeInfo mode={infoMode} onClose={() => setInfoMode(null)} />}
      {heartsOpen && <NoHearts onDrill={startDrill} onShop={() => { setHeartsOpen(false); setScreen('premium'); }} onClose={() => setHeartsOpen(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
